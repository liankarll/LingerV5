}

/* ───────────────────────── order flow sheet ───────────────────────── */
function sheetShell(inner, opts){
  opts = opts || {};
  var closable = opts.closable !== false;
  var closeAct = opts.closeAct || 'close-order-flow';
  var zIndex = opts.zIndex || 7;
  return '' +
  '<div style="position:absolute;inset:0;z-index:' + zIndex + ';display:flex;flex-direction:column;justify-content:flex-end;background:rgba(6,5,5,.8)" ' + (closable ? 'data-act="' + closeAct + '" data-backdrop="1"' : '') + '>' +
    '<div style="background:var(--surface);border-top:1px solid var(--border-strong);border-radius:16px 16px 41px 41px;padding:14px 22px 26px;display:flex;flex-direction:column;gap:20px;max-height:88%;overflow-y:auto;animation:sheetUp .28s ease" class="noscroll">' +
      '<div style="width:44px;height:4px;border-radius:2px;background:var(--border-hover);align-self:center;flex:none"></div>' +
      inner +
    '</div>' +
  '</div>';
}

function orderFlowSheet(){
  if (state.orderStep === 'fulfillment') return sheetShell(fulfillmentPane());
  if (state.orderStep === 'location') return sheetShell(locationPane());
  if (state.orderStep === 'payment') return sheetShell(paymentPane());
  if (state.orderStep === 'processing') return sheetShell(processingPane(), { closable:false });
  if (state.orderStep === 'done') return sheetShell(donePane(), { closable:false });
  return '';
}

function stepHeader(label, backAct, ariaLabel){
  ariaLabel = ariaLabel || 'Back';
  return '<div style="display:flex;align-items:center;gap:10px">' +
    (backAct ? '<button data-act="' + backAct + '" aria-label="' + esc(ariaLabel) + '" style="width:28px;height:28px;border-radius:50%;background:var(--surface-raised);display:grid;place-items:center;color:var(--text-dim)">' + ICONS.chev + '</button>' : '') +
    '<div class="mono uc" style="font-size:9.5px;letter-spacing:.16em;color:var(--text-ghost)">' + esc(label) + '</div>' +
  '</div>';
}

function fulfillmentPane(){
  return '' +
    stepHeader('Step 1 of 3', 'close-order-flow', 'Close') +
    '<div class="serif" style="font-size:28px;line-height:1.1;color:var(--text)">What should this album be called?</div>' +
    '<div>' +
      '<input id="albumNameInput" type="text" maxlength="40" placeholder="e.g. August, mostly buses" value="' + esc(state.albumName) + '" ' +
      'style="width:100%;background:transparent;border:none;border-bottom:1px solid var(--border-hover);padding-bottom:12px;font-family:var(--serif);font-size:21px;color:var(--text);outline:none" />' +
    '</div>' +
    '<div style="display:flex;flex-direction:column;gap:9px">' +
      '<button data-act="choose-fulfillment:pickup" style="display:flex;justify-content:space-between;align-items:center;border:1px solid var(--paper);border-radius:3px;padding:15px;text-align:left">' +
        '<div><div style="font-size:14.5px;font-weight:500;color:var(--text)">Pickup</div><div class="mono" style="font-size:9.5px;color:var(--text-faint);margin-top:3px">READY IN 48 HOURS</div></div>' +
        '<div style="width:15px;height:15px;border-radius:50%;background:var(--paper)"></div>' +
      '</button>' +
      '<div style="display:flex;justify-content:space-between;align-items:center;border:1px solid var(--border-strong);border-radius:3px;padding:15px;opacity:.45">' +
        '<div><div style="font-size:14.5px;font-weight:500;color:var(--text)">Delivery</div><div class="mono" style="font-size:9.5px;color:var(--text-faint);margin-top:3px">SOON</div></div>' +
        '<div style="width:15px;height:15px;border-radius:50%;border:1px solid var(--text-ghost)"></div>' +
      '</div>' +
    '</div>';
}

function locationPane(){
  var readyBy = fmtReadyBy(state.now, READY_HOURS);
  return '' +
    stepHeader('Step 2 of 3', 'order-back:fulfillment') +
    '<div class="serif" style="font-size:28px;line-height:1.1;color:var(--text)">Where are you picking them up?</div>' +
    '<div style="display:flex;flex-direction:column;gap:9px">' +
      LOCATIONS.map(function(loc){
        var sel = state.pickupLocation === loc;
        var sub = loc === 'One Ayala' ? 'LEVEL 2 · MAKATI' : 'GROUND FLOOR · QUEZON CITY';
        return '<button data-act="choose-location:' + loc.replace(' ','_') + '" style="display:flex;justify-content:space-between;align-items:center;border:1px solid ' + (sel?'var(--paper)':'var(--border-strong)') + ';border-radius:3px;padding:15px;text-align:left">' +
          '<div><div style="font-size:14.5px;font-weight:500;color:var(--text)">' + esc(loc) + '</div><div class="mono" style="font-size:9.5px;color:var(--text-faint);margin-top:3px">' + sub + '</div></div>' +
          '<div style="width:15px;height:15px;border-radius:50%;background:' + (sel?'var(--paper)':'transparent') + ';border:' + (sel?'none':'1px solid var(--text-ghost)') + '"></div>' +
        '</button>';
      }).join('') +
    '</div>' +
    '<div style="border-left:2px solid var(--safelight);padding:2px 0 2px 12px;display:flex;flex-direction:column;gap:4px">' +
      '<div class="mono uc" style="font-size:9.5px;letter-spacing:.1em;color:var(--safelight)">Ready in 48 hours</div>' +
      '<div class="serif" style="font-size:18px;color:var(--text)">' + readyBy + '</div>' +
    '</div>';
}

function paymentPane(){
  var name = state.albumName.trim() || 'Untitled Album';
  var count = state.tray.length;
  var total = count * PRICE_PER_PRINT;
  var readyBy = fmtReadyBy(state.now, READY_HOURS);
  var rows = [
    ['ALBUM', name], ['PRINTS', count + ' · Standard 3R'], ['FINISH', state.finish.charAt(0).toUpperCase()+state.finish.slice(1)],
    ['PICKUP', state.pickupLocation || '—'], ['READY BY', readyBy]
  ];
  var methods = [['card','Card'],['gcash','GCash'],['maya','Maya']];
  return '' +
    stepHeader('Step 3 of 3', 'order-back:location') +
    '<div class="serif" style="font-size:28px;line-height:1.1;color:var(--text)">One sheet, twelve prints</div>' +
    '<div style="border-top:1px solid var(--border-strong)">' +
      rows.map(function(r){
        return '<div style="display:flex;justify-content:space-between;align-items:baseline;padding:11px 0;border-bottom:1px solid var(--hairline)">' +
          '<div class="mono uc" style="font-size:9.5px;letter-spacing:.1em;color:var(--text-ghost)">' + r[0] + '</div>' +
          '<div style="font-size:13.5px;color:var(--text)">' + esc(r[1]) + '</div></div>';
      }).join('') +
    '</div>' +
    '<div style="display:flex;gap:7px">' +
      methods.map(function(m){
        var sel = state.payMethod === m[0];
        return '<button data-act="pay-method:' + m[0] + '" class="mono uc" style="flex:1;text-align:center;font-size:10px;letter-spacing:.08em;padding:12px 0;border:1px solid ' + (sel?'var(--paper)':'var(--border-strong)') + ';border-radius:2px;color:' + (sel?'var(--paper)':'var(--text-dim)') + '">' + m[1] + '</button>';
      }).join('') +
    '</div>' +
    '<button data-act="confirm-payment" style="display:flex;justify-content:space-between;align-items:center;background:var(--paper);color:var(--text-on-paper);border-radius:2px;padding:16px 18px">' +
      '<span class="mono uc" style="font-size:11px;letter-spacing:.14em">Pay</span>' +
      '<span class="serif" style="font-size:22px">₱' + total + '.00</span>' +
    '</button>';
}

function processingPane(){
  return '' +
    '<div style="display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:36px 10px 30px;text-align:center">' +
      '<div style="width:52px;height:52px;border-radius:50%;border:2px solid var(--border-strong);border-top-color:var(--safelight);animation:spin 1s linear infinite"></div>' +
      '<div class="serif" style="font-size:23px;color:var(--text);margin-top:14px">Placing your order' + '·'.repeat(state.processingDots) + '</div>' +
      '<div class="mono" style="font-size:10.5px;letter-spacing:.08em;color:var(--text-dimmer)">Sending your sheet to the lab</div>' +
      '<div style="width:100%;height:3px;border-radius:2px;background:var(--border-strong);overflow:hidden;margin-top:14px">' +
        '<div style="height:100%;width:' + state.processingProgress + '%;background:var(--safelight);transition:width .25s ease"></div>' +
      '</div>' +
      '<div class="mono" style="font-size:10px;color:var(--text-ghostest)">' + Math.round(state.processingProgress) + '%</div>' +
    '</div>';
}

function donePane(){
  var order = state.orders[state.orders.length - 1];
  var name = state.albumName.trim() || 'Untitled Album';
  var readyBy = fmtReadyBy(state.now, READY_HOURS);
  return '' +
    '<div style="display:flex;flex-direction:column;gap:6px">' +
      '<div class="mono uc" style="font-size:9.5px;letter-spacing:.16em;color:var(--safelight)">Order placed</div>' +
      '<div class="serif" style="font-size:30px;line-height:1.08;color:var(--text)">Your prints are in the bath</div>' +
      '<div style="font-size:13.5px;line-height:1.6;color:var(--text-dimmer)">We\'ll hold them at the counter for seven days. Bring the code.</div>' +
    '</div>' +
    '<div style="border:1px solid var(--border-strong);border-radius:3px;padding:18px;display:flex;flex-direction:column;gap:14px">' +
      '<div style="display:flex;flex-direction:column;gap:5px">' +
        '<div class="mono uc" style="font-size:9px;letter-spacing:.14em;color:var(--text-ghost)">Pickup code</div>' +
        '<div class="mono" style="font-size:28px;letter-spacing:.06em;color:var(--paper)">' + (order ? order.pickupCode : '—') + '</div>' +
      '</div>' +
      '<div style="height:1px;background:var(--hairline)"></div>' +
      '<div style="display:flex;flex-direction:column;gap:8px">' +
        [['ALBUM', name], ['PRINTS', MAX_SLOTS + ' · ' + (state.finish.charAt(0).toUpperCase()+state.finish.slice(1)) + ' 3R'], ['PICKUP', state.pickupLocation || '—'], ['READY BY', readyBy]].map(function(r){
          return '<div style="display:flex;justify-content:space-between"><span class="mono uc" style="font-size:9.5px;letter-spacing:.1em;color:var(--text-ghost)">' + r[0] + '</span><span style="font-size:13px;color:var(--text)">' + esc(r[1]) + '</span></div>';
        }).join('') +
      '</div>' +
    '</div>' +
    '<button data-act="order-done" class="paper-btn uc">Back to Print Lab</button>';
}

function orderPopup(){
  var order = orderById(state.viewingOrderId);
  if (!order) return '';
  var msLeft = Math.max(0, order.readyAtMs - state.now);
  var ready = msLeft <= 0;
  var grid = order.photos.map(function(p){
    return '<div style="aspect-ratio:1.43;border-radius:1px;overflow:hidden;' + photoStyle(p.id, true, true) + '"></div>';
  }).join('');
  return '' +
  '<div style="position:absolute;inset:0;z-index:8;display:flex;flex-direction:column;justify-content:flex-end;background:rgba(6,5,5,.78)" data-act="close-order-popup" data-backdrop="1">' +
    '<div style="background:var(--surface);border-top:1px solid var(--border-strong);border-radius:16px 16px 41px 41px;padding:14px 16px 24px;display:flex;flex-direction:column;gap:16px;max-height:82%;overflow-y:auto;animation:sheetUp .28s ease" class="noscroll">' +
      '<div style="width:44px;height:4px;border-radius:2px;background:var(--border-hover);align-self:center;flex:none"></div>' +
      '<div style="display:flex;justify-content:space-between;align-items:flex-end;padding:0 6px">' +
        '<div><div class="serif" style="font-size:23px;line-height:1;color:var(--text)">' + esc(order.name) + '</div><div class="mono" style="font-size:9.5px;letter-spacing:.1em;color:var(--text-faint);margin-top:5px">' + order.pickupCode + ' · ' + esc(order.location) + '</div></div>' +
        '<div class="mono uc" style="font-size:9.5px;letter-spacing:.1em;color:' + (ready?'var(--paper)':'var(--safelight)') + '">' + (ready ? 'Ready' : fmtCountdown(msLeft) + ' left') + '</div>' +
      '</div>' +
      '<div style="display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px">' + grid + '</div>' +
      '<button data-act="confirm-pickup:' + order.id + '" class="mono uc" style="font-size:10px;letter-spacing:.12em;color:' + (ready?'var(--paper)':'var(--text-ghostest)') + ';text-align:center;padding:10px 0">Mark as picked up</button>' +
    '</div>' +
  '</div>';
}

/* ───────────────────────── confirm sheet ───────────────────────── */
function confirmSheet(){
  var a = state.confirmAction;
  if (!a) return '';
  var copy = a.kind === 'pickup'
    ? { eyebrow:'Mark as picked up', title:'Picked up?', body:'This removes the order from your Print Lab list for good — there’s no undo in the prototype.', confirmLabel:'Mark picked up' }
    : { eyebrow:'Remove print', title:'Take this out of the sheet?', body:'It leaves your 12-slot tray. You can add it back anytime before you order.', confirmLabel:'Remove' };
  var inner =
    '<div style="display:flex;flex-direction:column;gap:6px;text-align:center;padding:6px 4px 0">' +
      '<div class="mono uc" style="font-size:9.5px;letter-spacing:.16em;color:var(--safelight)">' + esc(copy.eyebrow) + '</div>' +
      '<div class="serif" style="font-size:24px;line-height:1.15;color:var(--text)">' + esc(copy.title) + '</div>' +
      '<div style="font-size:13px;line-height:1.6;color:var(--text-dimmer);padding:2px 6px 0">' + esc(copy.body) + '</div>' +
    '</div>' +
    '<div style="display:flex;flex-direction:column;gap:10px;padding-top:8px">' +
      '<button data-act="confirm-do" class="paper-btn uc">' + esc(copy.confirmLabel) + '</button>' +
      '<button data-act="confirm-cancel" class="ghost-link uc">Cancel</button>' +
    '</div>';
  return sheetShell(inner, { closeAct:'confirm-cancel', zIndex:9 });
}

/* ───────────────────────── start flow: new roll / new event ───────────────────────── */
function startFlowSheet(){
  var opts = { closeAct:'close-start-flow' };
  if (state.startStep === 'choose')    return sheetShell(startChooserPane(), opts);
  if (state.startStep === 'roll-name') return sheetShell(rollNamePane(), opts);
  if (state.startStep === 'guests')    return sheetShell(eventGuestsPane(), opts);
  if (state.startStep === 'end')       return sheetShell(eventEndPane(), opts);
  if (state.startStep === 'develop')   return sheetShell(eventDevelopPane(), opts);
  if (state.startStep === 'review')    return sheetShell(eventReviewPane(), opts);
  return '';
}

function rollNamePane(){
  var nextNum = pad2(nextVisibleRollNumber());
  var delay = state.draftRollDelay || 24;
  return '' +
    stepHeader('New Roll', 'start-back:choose') +
    '<div class="serif" style="font-size:28px;line-height:1.1;color:var(--text)">What should this roll be called?</div>' +
    '<div>' +
      '<input id="rollNameInput" type="text" maxlength="40" placeholder="e.g. Sunday drive (optional)" value="' + esc(state.draftRollName || '') + '" ' +
      'style="width:100%;background:transparent;border:none;border-bottom:1px solid var(--border-hover);padding-bottom:12px;font-family:var(--serif);font-size:21px;color:var(--text);outline:none" />' +
    '</div>' +
    '<div class="mono uc" style="font-size:9.5px;letter-spacing:.14em;color:var(--text-ghost)">Develop how soon after you finish shooting?</div>' +
    '<div style="display:flex;gap:9px">' +
      [24,48].map(function(h){
        var sel = delay === h;
        return '<button data-act="pick-roll-delay:' + h + '" style="flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;border:1px solid ' + (sel?'var(--paper)':'var(--border-strong)') + ';border-radius:3px;padding:14px 8px;background:' + (sel?'rgba(244,239,230,.06)':'transparent') + '">' +
          '<div class="serif" style="font-size:22px;color:var(--text)">' + h + 'h</div>' +
          '<div class="mono uc" style="font-size:9px;letter-spacing:.08em;color:var(--text-faint)">after last shot</div>' +
        '</button>';
      }).join('') +
    '</div>' +
    '<div class="mono" style="font-size:10.5px;color:var(--text-faint);line-height:1.6">' + ROLL_EXPOSURES + ' exposures · leave blank for &ldquo;Roll ' + nextNum + '&rdquo;</div>' +
    '<button data-act="create-roll" class="paper-btn uc">Start Roll</button>';
}

function startChooserPane(){
  return '' +
    stepHeader('Start something new', 'close-start-flow', 'Close') +
    '<div class="serif" style="font-size:28px;line-height:1.1;color:var(--text)">Roll, or a whole event?</div>' +
    '<div style="display:flex;flex-direction:column;gap:9px">' +
      '<button data-act="choose-start:roll" style="display:flex;justify-content:space-between;align-items:center;border:1px solid var(--paper);border-radius:3px;padding:16px;text-align:left">' +
        '<div><div style="font-size:15px;font-weight:500;color:var(--text)">New Roll</div><div class="mono" style="font-size:9.5px;color:var(--text-faint);margin-top:3px">' + ROLL_EXPOSURES + ' EXPOSURES · JUST FOR YOU</div></div>' +
        '<span style="color:var(--text-dim);display:inline-flex;transform:rotate(180deg)">' + ICONS.chev + '</span>' +
      '</button>' +
      '<button data-act="choose-start:event" style="display:flex;justify-content:space-between;align-items:center;border:1px solid var(--border-strong);border-radius:3px;padding:16px;text-align:left">' +
        '<div><div style="font-size:15px;font-weight:500;color:var(--text)">New Event</div><div class="mono" style="font-size:9.5px;color:var(--text-faint);margin-top:3px">INVITE FRIENDS · SHOOT TOGETHER</div></div>' +
        '<span style="color:var(--text-dim);display:inline-flex;transform:rotate(180deg)">' + ICONS.chev + '</span>' +
      '</button>' +
    '</div>';
}

function eventGuestsPane(){
  var d = state.draftEvent;
  return '' +
    stepHeader('New Event · Step 1 of 3', 'start-back:choose') +
    '<div class="serif" style="font-size:28px;line-height:1.1;color:var(--text)">What should this event be called?</div>' +
    '<div>' +
      '<input id="eventNameInput" type="text" maxlength="40" placeholder="e.g. Boracay weekend" value="' + esc(d.name || '') + '" ' +
      'style="width:100%;background:transparent;border:none;border-bottom:1px solid var(--border-hover);padding-bottom:12px;font-family:var(--serif);font-size:21px;color:var(--text);outline:none" />' +
    '</div>' +
    '<div class="mono uc" style="font-size:9.5px;letter-spacing:.14em;color:var(--text-ghost)">How many guests can you invite?</div>' +
    '<div style="display:flex;gap:9px">' +
      GUEST_OPTIONS.map(function(n){
        var sel = d.guestCount === n;
        return '<button data-act="pick-guests:' + n + '" style="flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;border:1px solid ' + (sel?'var(--paper)':'var(--border-strong)') + ';border-radius:3px;padding:16px 8px;background:' + (sel?'rgba(244,239,230,.06)':'transparent') + '">' +
          '<div class="serif" style="font-size:26px;color:var(--text)">' + n + '</div>' +
          '<div class="mono uc" style="font-size:9px;letter-spacing:.08em;color:var(--text-faint)">guests</div>' +
        '</button>';
      }).join('') +
    '</div>' +
    (d.guestCount ? '<div class="mono uc" style="font-size:9.5px;letter-spacing:.1em;color:var(--text-ghost)">' + (d.guestCount + 1) + ' rolls total · you + ' + d.guestCount + ' guest' + (d.guestCount!==1?'s':'') + '</div>' : '') +
    '<button data-act="start-next:end" class="paper-btn ' + (d.guestCount?'':'disabled') + '" ' + (d.guestCount?'':'disabled') + '>Continue</button>';
}

function eventEndPane(){
  var d = state.draftEvent;
  var todayStr = new Date(state.now).toISOString().slice(0,10);
  return '' +
    stepHeader('New Event · Step 2 of 3', 'start-back:guests') +
    '<div class="serif" style="font-size:28px;line-height:1.1;color:var(--text)">When does the event end?</div>' +
    '<div>' +
      '<input id="eventEndInput" type="date" min="' + todayStr + '" value="' + esc(d.endDateStr || '') + '" ' +
      'style="width:100%;background:transparent;border:none;border-bottom:1px solid var(--border-hover);padding-bottom:12px;font-family:var(--mono);font-size:16px;color:var(--text);outline:none;color-scheme:dark" />' +
    '</div>' +
    '<div class="mono" style="font-size:10.5px;color:var(--text-faint);line-height:1.6">Guests can shoot until midnight on this date. Nobody can add more frames after that.</div>' +
    '<button data-act="start-next:develop" class="paper-btn ' + (d.endAtMs?'':'disabled') + '" ' + (d.endAtMs?'':'disabled') + '>Continue</button>';
}

function eventDevelopPane(){
  var d = state.draftEvent;
  // Only offer offsets from the event's own end time — both are guaranteed to land
  // after the event actually ends, so there's no way to pick a develop time that's
  // earlier than the end time (a custom date picker used to allow exactly that).
  var options = [['after24','24 hours after the event ends'],['after48','48 hours after the event ends']];
  return '' +
    stepHeader('New Event · Step 3 of 3', 'start-back:end') +
    '<div class="serif" style="font-size:28px;line-height:1.1;color:var(--text)">When should the rolls develop?</div>' +
    '<div style="display:flex;flex-direction:column;gap:9px">' +
      options.map(function(o){
        var sel = d.developMode === o[0];
        return '<button data-act="pick-develop:' + o[0] + '" style="display:flex;justify-content:space-between;align-items:center;border:1px solid ' + (sel?'var(--paper)':'var(--border-strong)') + ';border-radius:3px;padding:15px;text-align:left">' +
          '<div style="font-size:14.5px;font-weight:500;color:var(--text)">' + o[1] + '</div>' +
          '<div style="width:15px;height:15px;border-radius:50%;background:' + (sel?'var(--paper)':'transparent') + ';border:' + (sel?'none':'1px solid var(--text-ghost)') + '"></div>' +
        '</button>';
      }).join('') +
    '</div>' +
    '<button data-act="start-next:review" class="paper-btn ' + (draftDevelopReady(d)?'':'disabled') + '" ' + (draftDevelopReady(d)?'':'disabled') + '>Continue</button>';
}

function eventReviewPane(){
  var d = state.draftEvent;
  var developAtMs = resolvedDevelopAtMs(d);
  var rows = [
    ['EVENT', (d.name && d.name.trim()) ? d.name.trim() : 'Untitled Event'],
    ['GUESTS', d.guestCount + ' + you = ' + (d.guestCount + 1) + ' rolls'],
    ['EVENT ENDS', fmtDateAbs(d.endAtMs)],
    ['DEVELOPS', fmtDateAbs(developAtMs)]
  ];
  return '' +
    stepHeader('New Event · Review', 'start-back:develop') +
    '<div class="serif" style="font-size:28px;line-height:1.1;color:var(--text)">Ready to send invites</div>' +
    '<div style="border-top:1px solid var(--border-strong)">' +
      rows.map(function(r){
        return '<div style="display:flex;justify-content:space-between;align-items:baseline;padding:11px 0;border-bottom:1px solid var(--hairline)">' +
          '<div class="mono uc" style="font-size:9.5px;letter-spacing:.1em;color:var(--text-ghost)">' + r[0] + '</div>' +
          '<div style="font-size:13.5px;color:var(--text)">' + esc(r[1]) + '</div></div>';
      }).join('') +
    '</div>' +
    '<div class="mono" style="font-size:10.5px;color:var(--text-faint);line-height:1.6">Each guest gets their own ' + ROLL_EXPOSURES + '-exposure roll. Nobody sees any of it — including you — until developing day.</div>' +
    '<button data-act="create-event" class="paper-btn uc">Create Event</button>';
}

function eventDetailPane(event){
  if (!event) return '';
  var youRoll = rollById(event.rollIds[0]);
  var guestRolls = event.rollIds.slice(1).map(rollById).filter(Boolean);
  var locked = youRoll ? msUntilReveal(youRoll) > 0 : false;
  var rows = [
    ['ENDS', fmtDateAbs(event.endAtMs)],
    ['DEVELOPS', fmtDateAbs(event.developAtMs)]
  ];
  var youRow = youRoll ? (
    '<button data-act="roster-open-you:' + youRoll.id + '" aria-label="Open your roll" style="display:flex;justify-content:space-between;align-items:center;width:100%;border:1px solid var(--paper);border-radius:3px;padding:13px 15px;text-align:left">' +
      '<span style="font-size:14px;font-weight:500;color:var(--text)">You</span>' +
      '<span class="mono uc" style="font-size:9.5px;letter-spacing:.08em;color:var(--text-faint)">' + youRoll.shotCount + ' / ' + ROLL_EXPOSURES + (locked ? ' · locked' : '') + '</span>' +
    '</button>'
  ) : '';
  var guestRows = guestRolls.map(function(g){
    return '<div style="display:flex;justify-content:space-between;align-items:center;border:1px solid var(--border-strong);border-radius:3px;padding:13px 15px;opacity:.55">' +
      '<span style="font-size:14px;color:var(--text)">' + esc(g.label) + '</span>' +
      '<span class="mono uc" style="font-size:9.5px;letter-spacing:.08em;color:var(--text-faint)">' + (g.shotCount > 0 ? g.shotCount + ' / ' + ROLL_EXPOSURES : 'Not started') + '</span>' +
    '</div>';
  }).join('');
  return '' +
    stepHeader('Event roster', 'close-roster', 'Close') +
    '<div style="display:flex;flex-direction:column;gap:4px">' +
      '<div class="serif" style="font-size:26px;line-height:1;color:var(--text)">' + esc(rollDisplayName(youRoll)) + '</div>' +
      '<div class="mono uc" style="font-size:9px;letter-spacing:.1em;color:var(--text-faint)">' +
        event.guestCount + ' GUESTS INVITED · ' + rows.map(function(r){ return r[0] + ' ' + r[1]; }).join(' · ') +
      '</div>' +
    '</div>' +
    '<div style="display:flex;flex-direction:column;gap:8px">' + youRow + guestRows + '</div>' +
    '<div class="mono" style="font-size:10px;color:var(--text-ghostest);line-height:1.6">Guest rolls fill in as friends shoot on their own phones — this prototype shows them as placeholders.</div>';
}

/* ───────────────────────── main render ───────────────────────── */
function currentScreenHtml(){
  if (state.cameraView === 'full' && state.tab === 'camera') return screenFullCamera();
  if (state.tab === 'printlab') return screenPrintLab();
  if (state.cameraView === 'gallery') return screenGallery();
  if (state.cameraView === 'single') return screenSingle();
  return screenCameraHome();
}

// Which "page" is showing, and how deep it sits in the camera's navigation
// tree (home is the root; Full Camera and Gallery are pushed from home;
// Single Photo is pushed from Gallery). Print Lab is a sibling tab, not part
// of that stack, so tab switches don't get a directional slide.
function routeInfo(){
  if (state.tab === 'printlab') return { key:'printlab', depth:0 };
  var depths = { home:0, full:1, gallery:1, single:2 };
  return { key:'camera:' + state.cameraView, depth: depths[state.cameraView] };
}
var lastRoute = null;

function render(){
  var route = routeInfo();
  var animClass = '';
  if (lastRoute && lastRoute.key !== route.key && route.key.split(':')[0] === lastRoute.key.split(':')[0]){
    animClass = route.depth > lastRoute.depth ? ' anim-push' : (route.depth < lastRoute.depth ? ' anim-pop' : '');
  }
  var html = '<div class="' + animClass.trim() + '" style="position:absolute;inset:0">' + currentScreenHtml() + '</div>';
  if (state.ceremonyRollId) html += screenCeremony();
  if (state.startStep) html += startFlowSheet();
  if (state.rosterEventId) html += sheetShell(eventDetailPane(eventById(state.rosterEventId)), { closeAct:'close-roster' });
  if (state.confirmAction) html += confirmSheet();
  document.getElementById('screen').innerHTML = html;
  lastRoute = route;
  if (state.cameraView === 'full' && cameraMode === 'live' && cameraVideoEl){
    var vfSlot = document.getElementById('viewfinderVideoSlot');
    if (vfSlot){
      vfSlot.appendChild(cameraVideoEl);
      var playPromise = cameraVideoEl.play();
      if (playPromise && playPromise.catch) playPromise.catch(function(){});
    }
  }
  var fileInput = document.getElementById('cameraFileInput');
  if (fileInput){ fileInput.addEventListener('change', handleFileCapture); }
  saveState();
  var input = document.getElementById('albumNameInput');
  if (input){
    input.addEventListener('input', function(e){ state.albumName = e.target.value; });
    var pos = input.value.length;
    input.focus();
    try { input.setSelectionRange(pos, pos); } catch(e){}
  }
  var endInput = document.getElementById('eventEndInput');
  if (endInput){ endInput.addEventListener('change', function(e){ setEventEndDate(e.target.value); }); }
  var rollNameInput = document.getElementById('rollNameInput');
  if (rollNameInput){
    rollNameInput.addEventListener('input', function(e){ state.draftRollName = e.target.value; });
    var rPos = rollNameInput.value.length;
    rollNameInput.focus();
    try { rollNameInput.setSelectionRange(rPos, rPos); } catch(e){}
  }
  var eventNameInput = document.getElementById('eventNameInput');
  if (eventNameInput){
    eventNameInput.addEventListener('input', function(e){ setEventName(e.target.value); });
    var ePos = eventNameInput.value.length;
    eventNameInput.focus();
    try { eventNameInput.setSelectionRange(ePos, ePos); } catch(e){}
  }
}

/* ───────────────────────── event delegation ───────────────────────── */
document.getElementById('screen').addEventListener('click', function(e){
  var el = e.target.closest('[data-act]');
  if (!el) return;
  if (el.dataset.backdrop && e.target !== el) return;
  var act = el.getAttribute('data-act');
  var parts = act.split(':');
  var cmd = parts[0], arg = parts[1];

  switch(cmd){
    case 'open-full': openFullCamera(); break;
    case 'close-full': closeFullCamera(); break;
    case 'capture': onShutterTap(); break;
    case 'open-start-flow': openStartFlow(); break;
    case 'close-start-flow': closeStartFlow(); break;
    case 'choose-start': chooseStartKind(arg); break;
    case 'create-roll': createRollFromDraft(); break;
    case 'pick-roll-delay': setDraftRollDelay(parseInt(arg,10)); break;
    case 'start-next': startFlowNext(arg); break;
    case 'start-back': startFlowBack(arg); break;
    case 'pick-guests': pickGuestCount(parseInt(arg,10)); break;
    case 'pick-develop': setDevelopMode(arg); break;
    case 'create-event': createEvent(); break;
    case 'open-roster': openRoster(arg); break;
    case 'close-roster': closeRoster(); break;
    case 'roster-open-you': rosterOpenYou(arg); break;
    case 'open-roll': openRoll(arg); break;
    case 'switch-roll': switchRoll(arg === 'all' ? null : arg); break;
    case 'gallery-back': backToCameraHome(); break;
    case 'photo-tap': openSingle(arg); break;
    case 'toggle-print': togglePrint(arg); break;
    case 'single-back': backToGallery(); break;
    case 'single-nav': openSingle(arg); break;
    case 'ceremony-open': openCeremonyRoll(); break;
    case 'ceremony-later': dismissCeremony(); break;
    case 'tab': switchTab(arg); break;
    case 'finish': changeFinish(arg); break;
    case 'empty-slot': goToGalleryFromTray(); break;
    case 'confirm-remove-tray': requestConfirm('remove-tray', arg); break;
    case 'start-order': startOrder(); break;
    case 'close-order-flow': closeOrderFlow(); break;
    case 'order-back': orderBack(arg); break;
    case 'choose-fulfillment': chooseFulfillment(arg); break;
    case 'choose-location': choosePickupLocation(arg.replace('_',' ')); break;
    case 'pay-method': changePayMethod(arg); break;
    case 'confirm-payment': confirmPayment(); break;
    case 'order-done': orderDone(); break;
    case 'view-order': viewOrder(arg); break;
    case 'close-order-popup': closeOrderPopup(); break;
    case 'confirm-pickup': requestConfirm('pickup', arg); break;
    case 'confirm-cancel': cancelConfirm(); break;
    case 'confirm-do': confirmActionDo(); break;
    default: break;
  }
});

// A couple of tap targets (the roster link, the "Picked up" pill) live nested
// inside a larger card that's already a <button>, so they can't themselves be
// real <button> elements without invalid nested-button markup. They're marked
// role="button" tabindex="0" instead — this teaches them the Enter/Space
// activation a native button gets for free.
document.getElementById('screen').addEventListener('keydown', function(e){
  if (e.key !== 'Enter' && e.key !== ' ') return;
  var el = e.target.closest('[data-act]');
  if (!el || el.tagName === 'BUTTON' || el.tagName === 'INPUT' || el.tagName === 'A') return;
  e.preventDefault();
  el.click();
});

document.getElementById('resetBtn').addEventListener('click', resetAll);

/* ───────────────────────── responsive scale ───────────────────────── */
function fitDevice(){
  var wrap = document.getElementById('deviceWrap');
  var device = document.getElementById('device');
  var availW = window.innerWidth - 40;
  var availH = window.innerHeight - 220;
  var scale = Math.min(1, availW / 393, availH / 852);
  scale = Math.max(scale, 0.42);
  device.style.transform = 'scale(' + scale + ')';
  device.style.transformOrigin = 'top center';
  wrap.style.height = (852 * scale) + 'px';
  wrap.style.width = (393 * scale) + 'px';
}
window.addEventListener('resize', fitDevice);

/* ───────────────────────── boot ───────────────────────── */
function boot(){
  document.getElementById('screen').innerHTML = '<div style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:var(--text-dim);font-family:var(--mono);font-size:11px;letter-spacing:.14em">LOADING…</div>';
  fitDevice();
  dbGetAll().then(function(images){
    PHOTOS = images;
    var restored = loadState();
    if (restored) state = restored;
    lastRoute = null;
    render();
    if (state.cameraView === 'full'){
      var roll = activeRoll();
      var canShoot = !!roll && roll.status !== 'full' && !eventHasEnded(roll);
      if (canShoot) startCameraStream();
    }
    tickTimer = setInterval(function(){ state.now = Date.now(); render(); }, 30000);
  });
}
boot();

})();
</script>
